name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Lint SSH workflow scripts with bash -n
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          workflow_dir = Path('.github/workflows')
          workflow_files = sorted(workflow_dir.glob('*.yml')) + sorted(workflow_dir.glob('*.yaml'))

          if not workflow_files:
            raise SystemExit('No workflow files found under .github/workflows')

          uses_pattern = re.compile(r'^\s*uses:\s*(\S+)\s*$')
          step_start_pattern = re.compile(r'^\s*-\s*(name|uses|id|run|if|with)\s*:')

          total_blocks = 0
          failures = []

          for workflow in workflow_files:
            lines = workflow.read_text(encoding='utf-8').splitlines()
            current_uses = ''
            i = 0

            while i < len(lines):
              line = lines[i]
              stripped = line.lstrip(' ')
              indent = len(line) - len(stripped)

              if step_start_pattern.match(line) and stripped.startswith('- '):
                current_uses = ''

              uses_match = uses_pattern.match(line)
              if uses_match:
                current_uses = uses_match.group(1)

              if stripped == 'script: |' and current_uses.startswith('appleboy/ssh-action@'):
                block_indent = indent + 2
                i += 1
                block = []

                while i < len(lines):
                  current = lines[i]
                  current_stripped = current.lstrip(' ')
                  current_indent = len(current) - len(current_stripped)

                  if current.strip() == '':
                    block.append('')
                    i += 1
                    continue

                  if current_indent < block_indent:
                    break

                  block.append(current[block_indent:])
                  i += 1

                total_blocks += 1
                script = '\n'.join(block) + '\n'

                with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as tmp:
                  tmp.write(script)
                  tmp_path = tmp.name

                result = subprocess.run(
                  ['bash', '-n', tmp_path],
                  capture_output=True,
                  text=True,
                  check=False,
                )

                if result.returncode != 0:
                  failures.append((str(workflow), total_blocks, result.stderr.strip()))

                continue

              i += 1

          if total_blocks == 0:
            raise SystemExit('No appleboy/ssh-action script blocks found to lint')

          if failures:
            for workflow, block_idx, error in failures:
              print(f'{workflow} block #{block_idx} failed bash -n:\n{error}\n')
            raise SystemExit(1)

          print(f'Validated {total_blocks} SSH script block(s) across {len(workflow_files)} workflow file(s)')
          PY

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run hardening policy checks
        run: python3 scripts/check_hardening.py

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just

      - name: Install Playwright Chromium
        run: uv run --group test playwright install chromium

      - name: Ensure database directory exists
        run: mkdir -p database

      - name: Run home markup parity guard tests
        env:
          QUIZ_DATABASE_URL: sqlite:///./database/ci_quiz_data.db
        run: >
          uv run --group test python -m pytest test_backend/test_main.py -k
          "extracted_screen_partials or static_fixture_contains_critical_home_ui_ids or share_script_bootstrap_order or keep_screen_and_modal_order"

      - name: Run tests
        env:
          QUIZ_DATABASE_URL: sqlite:///./database/ci_quiz_data.db
        run: uv run python -m unittest discover -s test_backend -p 'test_*.py'

      - name: Run frontend specs
        run: just frontend

      - name: Run frontend integration suite
        env:
          QUIZ_DATABASE_URL: sqlite:///./database/ci_quiz_data.db
        run: just frontend_integration

      - name: Generate repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          artifact-name: source-sbom.spdx.json
          upload-release-assets: false
